display_information:
  name: Legal Team OS
  description: Intake and triage for the in-house legal team
  background_color: "#3730a3"

features:
  bot_user:
    display_name: Legal Bot
    always_online: true

  slash_commands:
    - command: /legal
      description: Open a new legal request
      usage_hint: review the Acme MSA before Friday
      should_escape: false

oauth_config:
  scopes:
    bot:
      - app_mentions:read
      - channels:history
      - channels:read
      - chat:write
      - commands
      - groups:history
      - groups:read
      - im:history
      - im:read
      - im:write
      - mpim:history
      - mpim:read
      - users:read
      - users:read.email
      - files:read

settings:
  event_subscriptions:
    bot_events:
      - app_mention
      - message.channels
      - message.groups
      - message.im
      - message.mpim

  interactivity:
    is_enabled: false

  socket_mode_enabled: true
  token_rotation_enabled: false

  org_deploy_enabled: false
