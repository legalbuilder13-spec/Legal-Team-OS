display_information:
  name: Legal Team OS 1

features:
  bot_user:
    display_name: Legal Team OS 1
    always_online: false

  slash_commands:
    - command: /legal
      description: Legal Escalation
      should_escape: false

oauth_config:
  scopes:
    user:
      - search:read
    bot:
      - chat:write
      - commands
      - im:write
      - users:read
      - users:read.email

settings:
  interactivity:
    # Item 9 — M6 nudge DMs include a "Save as playbook" button whose
    # action_id is handled by apps/bot/src/actions/save-playbook.ts.
    # Interactivity must be enabled for Bolt to receive the action
    # callback (delivered via socket_mode below).
    is_enabled: true

  socket_mode_enabled: true
  token_rotation_enabled: false

  org_deploy_enabled: false
